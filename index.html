<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <title>Travel Itinerary PDF Generator</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="styles.css" />
</head>

<body>
    <header class="topbar">
        <h1>Travel Itinerary Planner</h1>
    </header>

    <main class="container">
        <section class="form-section">
            <h2>Trip details</h2>
            <form id="itinerary-form">
                <!-- basic fields stay the same -->
                ...
                <h3>Daily itinerary</h3>
                <div id="days-container"></div>

                <button type="button" id="add-day-btn" class="btn secondary">
                    + Add day
                </button>
            </form>
        </section>
    </main>
    <div id="preview-overlay" class="preview-overlay hidden">
        <div class="preview-modal">
            <div class="preview-header">
                <h2 id="pdf-title">Travel Itinerary</h2>
                <button type="button" id="close-preview" class="btn secondary">Close</button>
            </div>
            <p id="pdf-meta"></p>
            <table id="pdf-table">
                <thead id="pdf-thead"></thead>
                <tbody id="pdf-table-body"></tbody>
            </table>
            <div class="preview-actions">
                <button type="button" id="download-pdf-btn" class="btn primary">
                    Download PDF
                </button>
            </div>
        </div>
    </div>

    <!-- jsPDF + html2canvas from CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

    <script src="app.js"></script>
</body>

</html>
